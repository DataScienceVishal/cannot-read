[project]
name = "cannot-read"
version = "0.1.0"
description = "Scores benchmarks with predictors that never see the input, through each benchmark's unmodified scorer"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # Enforces the no-network rule rather than trusting it: --disable-socket makes
    # any accidental network call a test failure.
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cannotread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# BLE catches the blanket `except Exception` that the style rules ban outright.
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
